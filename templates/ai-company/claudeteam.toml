# AI company: manager + developer + deployment engineer + operations engineer + product manager.
# Copy this whole directory into the deployment data directory, then fill chat_id.

chat_id       = ""
default_model = "gpt-5.4-mini"

[team]
session = "AI-Company"

[team.agents.manager]
cli        = "codex-cli"
model      = "gpt-5.4"
reasoning_effort = "medium"
role       = "主管：需求分析、任务拆解、并行调度与验收"
specialty  = ["需求分析", "任务拆解", "并行调度", "风险判断", "交付验收"]
playbook   = "manager.md"
card_color = "blue"

[team.agents.developer]
cli        = "codex-cli"
model      = "gpt-5.6-terra"
reasoning_effort = "high"
role       = "开发员工：代码实现、测试与技术文档"
specialty  = ["代码实现", "自动化测试", "代码审查", "故障修复"]
playbook   = "developer.md"
card_color = "purple"

[team.agents.deployer]
cli        = "codex-cli"
model      = "gpt-5.4-mini"
reasoning_effort = "low"
role       = "部署员工：通过 SSH 执行受控部署、验证与回滚"
specialty  = ["Git 部署", "Docker Compose", "健康检查", "回滚", "Android debug 构建"]
playbook   = "deployer.md"
card_color = "green"

[team.agents.ops]
cli        = "codex-cli"
model      = "gpt-5.4"
reasoning_effort = "low"
role       = "智能运维员工：日志优先的只读排障与运行检查"
specialty  = ["故障诊断", "日志分析", "按需存储排查", "Docker Compose", "阿里云 SLS"]
playbook   = "ops.md"
card_color = "orange"

[team.agents.product_manager]
cli        = "codex-cli"
model      = "gpt-5.4"
reasoning_effort = "medium"
role       = "产品经理员工：结合当前产品现状与外部主流方案，输出可执行的迭代优化建议"
specialty  = ["产品巡检", "交互体验分析", "竞品与主流方案调研", "需求整理", "优先级判断", "验收标准补全"]
playbook   = "product_manager.md"
card_color = "yellow"
notes      = "负责查看现有软件的可优化点，并主动参考相关项目、竞品和当前主流设计思路，输出结构化建议与需求草案；不写代码、不查服务、不部署。优先关注主路径、理解成本、重复操作、交互断裂、体验一致性，以及哪些外部成熟方案值得借鉴。"

[chat.publish]
user_to_manager   = "always"
manager_to_user   = "always"
manager_to_worker = true
worker_to_manager = true
worker_to_user    = false
worker_to_worker  = false

[feishu]
send_as          = "bot"
no_proxy         = true
broadcast_tokens = ["@team", "@all", "@everyone"]

[startup]
roll_call = false
