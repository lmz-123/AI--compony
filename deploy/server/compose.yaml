services:
  claudeteam:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: ai-company:local
    init: true
    restart: unless-stopped
    volumes:
      - ../../src:/app/src:ro
      - ../../team-data:/data
      - ../../projects:/workspace/projects
      - ../../server-secrets/codex/config.toml:/root/.codex/config.toml:ro
      - ../../server-secrets/ssh:/root/.ssh:ro
      - ./entrypoint.sh:/opt/ai-company/entrypoint.sh:ro
    environment:
      CLAUDETEAM_LARK_SEND_AS: bot
      LARK_CLI_NO_PROXY: "1"
    network_mode: host
    tty: true
    stdin_open: true
    command: ["/bin/bash", "/opt/ai-company/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "claudeteam", "health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
